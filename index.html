<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Séances, exercices, séries, charges.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCU">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SCU</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="programme.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<main id="app"></main>

<section id="timer" class="timer" hidden aria-label="Repos">
  <div class="ruler" aria-hidden="true"><div class="rfill"></div><i class="needle"></i></div>
  <div class="trow">
    <button class="tkey" data-act="t-minus" aria-label="Moins 15 secondes"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H40a12,12,0,0,1,0-24H216A12,12,0,0,1,228,128Z"/></svg></button>
    <button class="tgo" id="tgo" data-act="t-toggle" aria-label="Démarrer le repos">
      <span class="tclock" id="tclock" role="timer">01:30</span>
      <span class="tstate" id="tstate">Démarrer</span>
    </button>
    <button class="tkey" data-act="t-plus" aria-label="Plus 15 secondes"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z"/></svg></button>
  </div>
</section>

<div id="toast" class="toast" hidden role="status"></div>
<div id="sheet"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
</body>
</html>
